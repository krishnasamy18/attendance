<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOD Dashboard | Attendance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/live-monitoring.css">
  <link rel="stylesheet" href="css/low-attendance.css">
  <link rel="stylesheet" href="css/staff-attendance.css">
</head>
<body class="dashboard-body">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <header class="top-header">
    <div class="top-header-left">
      <button class="hamburger" id="hamburger" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
      <h1 class="header-title" id="header-title">HOD Dashboard</h1>
    </div>
    <div class="top-header-right">
      <button class="header-icon-btn" id="notif-btn" aria-label="Notifications">
        <i class="fas fa-bell"></i>
        <span class="notif-badge" id="notif-badge"></span>
      </button>
      <div class="header-user" id="header-user" role="button" aria-label="Profile">
        <div class="header-user-info">
          <div class="name"></div>
          <div class="role">HOD</div>
        </div>
        <div class="avatar" style="width:38px;height:38px;font-size:14px"></div>
      </div>
    </div>
  </header>

  <div class="notif-dropdown" id="notif-dropdown">
    <div class="notif-head">Notifications</div>
    <div class="notif-list" id="notif-list"></div>
  </div>

  <div class="profile-dropdown" id="profile-dropdown">
    <div class="profile-dd-head">
      <div class="avatar"></div>
      <div>
        <div class="name"></div>
        <div class="role" id="dd-role"></div>
      </div>
    </div>
    <button class="profile-dd-item" data-dd-profile><i class="fas fa-user"></i>My Profile</button>
    <button class="profile-dd-item" data-dd-logout><i class="fas fa-power-off"></i>Logout</button>
  </div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 id="welcome">Welcome!</h1>
        <p id="hod-subtitle">Loading department overview...</p>
      </div>
      <a class="btn btn-primary" href="attendance.html?mode=monitor">
        <i class="fas fa-chart-line"></i> Attendance Monitor
      </a>
      <a class="btn btn-outline live-header-link" href="hod-live-monitoring.html" id="hod-live-header" title="Live classroom monitoring">
        <i class="fas fa-video"></i> Live Monitoring
      </a>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <div id="live-monitoring-section"></div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-bottom:24px">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-percent"></i>Department Attendance</div>
        </div>
        <div class="chart-container" style="height:260px"><canvas id="dept-chart"></canvas></div>
        <div class="kpi-legend mt-16" id="dept-legend"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-school"></i>Class-wise Attendance</div>
        </div>
        <div class="table-responsive">
          <table class="table">
            <thead><tr><th>Class</th><th>Students</th><th>Attendance %</th></tr></thead>
            <tbody id="class-wise-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="hod-staffatt-section"></div>

    <div class="card">
      <div class="card-body" id="hod-lowatt-section"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
    <script src="js/photo.js"></script>
  <script src="js/app.js"></script>
  <script src="js/hod.js"></script>
  <script src="js/services/realtimeService.js"></script>
  <script src="js/services/attendanceSessionService.js"></script>
  <script src="js/services/cameraService.js"></script>
  <script src="js/live-attendance.js"></script>
  <script src="js/services/lowAttendanceService.js"></script>
  <script src="js/services/reminderService.js"></script>
</body>
</html>
