<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Student Dashboard | Attendance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/mobile.css">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RPSIT Attendance">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body class="dashboard-body">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <header class="top-header">
    <div class="top-header-left">
      <button class="hamburger" id="hamburger" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
      <h1 class="header-title" id="header-title">Student Dashboard</h1>
    </div>
    <div class="top-header-right">
      <button class="header-icon-btn" id="notif-btn" aria-label="Notifications">
        <i class="fas fa-bell"></i>
        <span class="notif-badge" id="notif-badge"></span>
      </button>
      <div class="header-user" id="header-user" role="button" aria-label="Profile">
        <div class="header-user-info">
          <div class="name"></div>
          <div class="role">Student</div>
        </div>
        <div class="avatar" style="width:38px;height:38px;font-size:14px"></div>
      </div>
    </div>
  </header>

  <div class="notif-dropdown" id="notif-dropdown">
    <div class="notif-head">Notifications</div>
    <div class="notif-list" id="notif-list"></div>
  </div>

  <div class="profile-dropdown" id="profile-dropdown">
    <div class="profile-dd-head">
      <div class="avatar"></div>
      <div>
        <div class="name"></div>
        <div class="role" id="dd-role"></div>
      </div>
    </div>
    <button class="profile-dd-item" data-dd-profile><i class="fas fa-user"></i>My Profile</button>
    <a href="student-dashboard.html" class="profile-dd-item" style="display:none"></a>
    <button class="profile-dd-item" data-dd-logout><i class="fas fa-power-off"></i>Logout</button>
  </div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 id="welcome">Hello!</h1>
        <p id="student-subtitle">Loading your attendance overview...</p>
      </div>
      <div class="flex items-center gap-10">
        <a class="btn btn-primary" href="attendance.html">
          <i class="fas fa-clipboard-check"></i> View Attendance
        </a>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="stat-grid" id="stat-grid"></div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-bottom:24px">
      <!-- Attendance ring card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-percent"></i>Overall Attendance</div>
        </div>
        <div class="ring-wrap">
          <div class="ring" id="attendance-ring"></div>
          <p class="text-muted" id="ring-subtitle" style="font-size:13px"></p>
        </div>
      </div>

      <!-- Subject-wise attendance -->
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-book-open"></i>Subject-wise Attendance</div>
          <a href="attendance.html" class="btn btn-sm btn-outline">View All</a>
        </div>
        <div class="table-responsive">
          <table class="table table-cards" id="subject-attendance-table">
            <thead>
              <tr>
                <th>Subject</th>
                <th>Total</th>
                <th>Present</th>
                <th>Absent</th>
                <th>%</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Recent attendance -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-clock-rotate-left"></i>Recent Attendance</div>
        <a href="attendance.html?view=history" class="btn btn-sm btn-outline">Full History</a>
      </div>
      <div class="table-responsive">
        <table class="table table-cards" id="recent-attendance-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Subject</th>
              <th>Hour</th>
              <th>Staff</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
    <script src="js/photo.js"></script>
  <script src="js/app.js"></script>
  <script src="js/student.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
