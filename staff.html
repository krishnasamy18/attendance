<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Staff | Attendance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/mobile.css">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RPSIT Attendance">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/staff-attendance.css">
</head>
<body class="dashboard-body">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <header class="top-header">
    <div class="top-header-left">
      <button class="hamburger" id="hamburger" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
      <h1 class="header-title" id="header-title">Staff Management</h1>
    </div>
    <div class="top-header-right">
      <button class="header-icon-btn" id="notif-btn" aria-label="Notifications">
        <i class="fas fa-bell"></i>
        <span class="notif-badge" id="notif-badge"></span>
      </button>
      <div class="header-user" id="header-user" role="button" aria-label="Profile">
        <div class="header-user-info">
          <div class="name"></div>
          <div class="role"></div>
        </div>
        <div class="avatar" style="width:38px;height:38px;font-size:14px"></div>
      </div>
    </div>
  </header>

  <div class="notif-dropdown" id="notif-dropdown">
    <div class="notif-head">Notifications</div>
    <div class="notif-list" id="notif-list"></div>
  </div>

  <div class="profile-dropdown" id="profile-dropdown">
    <div class="profile-dd-head">
      <div class="avatar"></div>
      <div>
        <div class="name"></div>
        <div class="role" id="dd-role"></div>
      </div>
    </div>
    <button class="profile-dd-item" data-dd-profile><i class="fas fa-user"></i>My Profile</button>
    <button class="profile-dd-item" data-dd-logout><i class="fas fa-power-off"></i>Logout</button>
  </div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Staff Management</h1>
        <p id="staff-subtitle">Loading staff...</p>
      </div>
      <div class="flex items-center gap-10">
        <a class="btn btn-outline" href="staff-attendance.html" style="height:38px">
          <i class="fas fa-clipboard-user"></i> Mark Staff Attendance
        </a>
        <button class="btn btn-primary" id="btn-add-staff">
          <i class="fas fa-user-plus"></i> Add Staff
        </button>
      </div>
    </div>

    <div class="table-toolbar" style="justify-content:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px">
      <div class="form-group" style="margin:0">
        <label>Search</label>
        <div class="search" style="width:230px">
          <input type="text" class="form-control" id="staff-search" placeholder="Name, staff ID or email...">
        </div>
      </div>
      <div class="form-group" style="margin:0">
        <label>Department</label>
        <select class="form-control" id="staff-filter-dept" style="width:auto">
          <option value="">All Departments</option>
        </select>
      </div>
      <div class="form-group" style="margin:0">
        <label>Designation</label>
        <select class="form-control" id="staff-filter-desig" style="width:auto">
          <option value="">All Designations</option>
        </select>
      </div>
      <div class="form-group" style="margin:0">
        <label>Employment Status</label>
        <select class="form-control" id="staff-filter-status" style="width:auto">
          <option value="">All Statuses</option>
          <option>Active</option>
          <option>On Leave</option>
          <option>Contract</option>
          <option>Resigned</option>
          <option>Retired</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table staff-rich-table">
          <thead>
            <tr>
              <th>Photo</th>
              <th>Staff ID</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Department</th>
              <th>Designation</th>
              <th>Qualification</th>
              <th>Experience</th>
              <th>Subjects Handled</th>
              <th>Classes Assigned</th>
              <th>Joining Date</th>
              <th>Employment Status</th>
              <th>Attendance %</th>
              <th>Today's Status</th>
              <th>Last Attendance</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="staff-tbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="staff-pagination"></div>
    </div>
  </main>

  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/photo.js"></script>
  <script src="js/app.js"></script>
  <script src="js/services/realtimeService.js"></script>
  <script src="js/hod.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
